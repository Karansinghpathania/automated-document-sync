name: Documentation Sync

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number for manual verification. Required for workflow_dispatch.'
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  documentation-sync:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run validation suite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          python -m pytest -q

      - name: Run documentation sync orchestration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number || 0 }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name || github.repository }}
        run: |
          python -m doc_sync.cli --event "${{ github.event_name }}" --repo "${GITHUB_REPOSITORY}" --pr-number "${PR_NUMBER}" --head-sha "${PR_HEAD_SHA}" --base-sha "${PR_BASE_SHA}" --workflow-run-id "${WORKFLOW_RUN_ID}" --token "${GITHUB_TOKEN}"
